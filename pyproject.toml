[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rp-tritonserver"
version = "0.1.0"
description = "RunPod serverless worker — Triton + vLLM, OpenAI-compatible"
requires-python = ">=3.10"
dependencies = [
    "runpod",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
